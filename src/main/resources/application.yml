server:
  port: 8087

spring:
  application:
    name: ph-ee-connector-mt

zeebe:
  enabled: ${ZEEBE_ENABLED:true}
  broker:
    contactpoint: ${ZEEBE_BROKER_CONTACTPOINT:127.0.0.1:26500}
  client:
    max-execution-threads: 16
    evenly-allocated-max-jobs: 64
    poll-interval: 100

# Monétique Tunisie gateway endpoint (sandbox or production)
mt:
  gateway:
    base-url: ${MT_GATEWAY_BASE_URL:http://localhost:8097}
    api-key: ${MT_GATEWAY_API_KEY:}
    merchant-id: ${MT_MERCHANT_ID:NEXUS-MERCHANT}
  callback-base-url: ${MT_CALLBACK_BASE_URL:http://localhost:8087}
  card-api-base-url: ${CARD_API_BASE_URL:http://localhost:3000}
  notification-api-base-url: ${NOTIFICATION_API_BASE_URL:http://localhost:8096}
  ams-base-url: ${AMS_BASE_URL:http://ph-ee-connector-ams-mifos:70}
  core-banking-base-url: ${CORE_BANKING_BASE_URL:http://core-api-core-banking-api.api.svc.cluster.local}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    payment-confirmation-topic: ${KAFKA_TOPIC_PAYMENT_CONFIRMATION:notification.payment-confirmation}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.mifos.connector.mt: DEBUG
